<!doctype html>
<html lang="es">
<head>

<title>PRIOR · El futuro se practica.</title>

<style>
/* ============ Horizonte · UX-003 (kit V1 borrador, 19 nov 2026) ============ */
:root{
  /* Tokens OFICIALES Horizonte (kit 14 oct 2026) */
  --principal:#1B2A4A; --acento:#E8A33D; --cielo:#7FB3D5; --arena:#E6DFD3;
  --texto:#16213A; --texto2:#5B6475; --fondo:#F7F3EA; --tarjeta:#FFFFFF;
  --sobre-principal:#F7F3EA; --sol:#E8A33D;
  /* Extensión PROPUESTA en el kit V1: NO son decisiones oficiales de marca (pendientes de aprobación) */
  --borde:#7A8091;          /* borde fuerte de controles (3,56:1 sobre fondo) */
  --seleccion:#E8F0F7;      /* relleno de opción elegida */
  --error:#A8322B; --error-fondo:#F8E5E2;
  --deshab-texto:#6F7686; --deshab-fondo:#ECE6DA;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root{
    --principal:#8EC3E6; --acento:#F0B24E; --cielo:#4F7396; --arena:#2A3550;
    --texto:#F2EDE3; --texto2:#A9B1C1; --fondo:#0F1A2E; --tarjeta:#18243B;
    --sobre-principal:#0F1A2E; --sol:#F0B24E;
    /* Extensión PROPUESTA (modo oscuro) */
    --borde:#6B7894; --seleccion:#1E3350;
    --error:#FF9A8F; --error-fondo:#3E1F25;
    --deshab-texto:#7D879B; --deshab-fondo:#1E2A42;
    color-scheme: dark;
  }
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--fondo); color:var(--texto);
  font-family:Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  font-size:16px; line-height:1.625; -webkit-font-smoothing:antialiased;
}
.app{
  max-width:460px; margin:0 auto; min-height:100%;
  display:flex; flex-direction:column;
  padding:calc(env(safe-area-inset-top,0px) + 24px) 20px calc(env(safe-area-inset-bottom,0px) + 32px);
}
/* Tablet y escritorio: columna de lectura centrada (kit: máx. 680 px) */
@media (min-width:700px){ .app{max-width:640px; padding-left:24px; padding-right:24px} }
@media (min-width:1024px){ .app{max-width:680px; padding-top:calc(env(safe-area-inset-top,0px) + 40px)} }
h1,h2,.marca{font-family:"Plus Jakarta Sans", Inter, system-ui, sans-serif;}
.marca{font-weight:700; letter-spacing:.14em; font-size:15px; color:var(--principal);}
button{font:inherit; color:inherit; cursor:pointer}
/* Foco: anillo de 3 px que nunca se oculta (Primary del modo; kit) */
:focus-visible{outline:3px solid var(--principal); outline-offset:3px; border-radius:12px}

/* Horizonte: barra de progreso con sol que sube (relleno Primary que termina en el sol con contorno) */
.horizonte{position:relative; height:46px; margin:20px 0 10px}
.horizonte .linea{position:absolute; left:0; right:0; bottom:10px; height:2px; background:var(--arena)}
.horizonte .avance{position:absolute; left:0; bottom:10px; height:2px; background:var(--principal); transition:width .5s ease}
.horizonte .sol{position:absolute; width:22px; height:22px; border-radius:50%; background:var(--sol); border:2px solid var(--principal);
  transform:translate(-50%, 0); transition:left .5s ease, bottom .5s ease}
.horizonte .paso{position:absolute; right:0; top:0; font-size:14px; color:var(--texto2)}
.bloque{font-size:14px; color:var(--texto2); font-weight:500}

/* Guía */
.guia{display:flex; flex-direction:column; gap:14px; margin:28px 0 8px}
.burbuja{
  background:var(--tarjeta); border:1px solid var(--arena); border-radius:4px 12px 12px 12px;
  padding:16px 18px; max-width:min(92%, 65ch); min-height:1.6em;
}
.burbuja.pregunta{font-weight:600}
.burbuja.entra{animation:entra .25s ease both}
@keyframes entra{from{opacity:0; transform:translateY(8px)}to{opacity:1; transform:none}}
.saltar{font-size:14px; color:var(--texto2); background:none; border:0; padding:10px 0; min-height:44px; align-self:flex-start; text-decoration:underline}

/* Opciones: borde fuerte de 2 px; elegida = borde Primary + relleno + ✓ + etiqueta (no depende del color) */
.opciones{display:flex; flex-direction:column; gap:12px; margin-top:26px}
.opcion{
  display:flex; gap:12px; align-items:flex-start; text-align:left; min-height:56px;
  background:var(--tarjeta); border:2px solid var(--borde); border-radius:12px; padding:14px 16px;
  transition:border-color .15s, background .15s;
}
.opcion > span:not(.letra){flex:1}
.opcion .letra{flex:0 0 26px; height:26px; border-radius:50%; display:grid; place-items:center;
  font-size:13px; font-weight:600; background:var(--arena); color:var(--texto)}
.opcion:hover{border-color:var(--principal)}
.opcion[aria-pressed="true"]{border-color:var(--principal); background:var(--seleccion)}
.opcion[aria-pressed="true"] .letra{background:var(--principal); color:var(--sobre-principal)}
.opcion[aria-pressed="true"]::after{content:"✓ Elegida"; flex:0 0 auto; align-self:center; font-size:12px; font-weight:600;
  letter-spacing:.02em; color:var(--principal)}
.opcion:disabled{cursor:default}
.opcion:disabled:not([aria-pressed="true"]){opacity:.55}
.oculto{display:none !important}

.consecuencia{
  margin-top:24px; padding:14px 16px; border:1px solid var(--arena); border-left:4px solid var(--principal);
  background:var(--tarjeta); border-radius:4px 12px 12px 4px; font-size:15px;
}
.consecuencia b{font-weight:600}

/* Botones: primario (uno por pantalla), secundario, terciario; estados normal, hover, presionado, foco, deshabilitado */
.acciones{margin-top:auto; padding-top:36px; display:flex; flex-direction:column; gap:10px}
.btn{
  border:2px solid transparent; border-radius:12px; padding:12px 18px; min-height:48px; font-weight:600; font-size:16px;
  background:var(--principal); color:var(--sobre-principal);
}
.btn:hover:not(:disabled){filter:brightness(1.15)}
.btn:active:not(:disabled){filter:brightness(.92)}
.btn:disabled{background:var(--deshab-fondo); color:var(--deshab-texto); cursor:not-allowed}
.btn.secundario{background:transparent; color:var(--principal); border-color:var(--borde)}
.btn.secundario:hover:not(:disabled){filter:none; border-color:var(--principal); background:var(--seleccion)}
.btn.secundario:disabled{background:transparent; border-color:var(--arena); color:var(--deshab-texto)}
.btn.texto{background:none; color:var(--principal); font-weight:500; padding:10px; text-decoration:underline; border-color:transparent}
.btn.texto:hover:not(:disabled){filter:none; background:var(--seleccion)}

/* Bienvenida */
.portada{flex:1; display:flex; flex-direction:column; justify-content:center}
.escena{position:relative; height:150px; margin:10px 0 26px}
.escena .sol-grande{position:absolute; left:50%; bottom:28px; width:96px; height:96px; border-radius:50%;
  background:var(--sol); transform:translate(-50%, 60%); animation:amanecer 1.6s cubic-bezier(.2,.7,.2,1) .2s forwards}
.escena .mar{position:absolute; left:0; right:0; bottom:0; height:30px; background:var(--fondo)}
.escena .linea{position:absolute; left:0; right:0; bottom:29px; height:2px; background:var(--cielo)}
@keyframes amanecer{to{transform:translate(-50%, 0)}}
/* Display: Plus Jakarta Sans 700, 32/40 en móvil y 40/48 en pantallas grandes */
.lema{font-size:32px; line-height:40px; font-weight:700; letter-spacing:-.02em; margin:0 0 10px; color:var(--principal)}
@media (min-width:700px){ .lema{font-size:40px; line-height:48px} }
.sublema{color:var(--texto2); margin:0}

/* Resultado */
/* H1: Plus Jakarta Sans 600, 28/36 en móvil y 32/40 en pantallas grandes */
.titulo{font-size:28px; line-height:36px; font-weight:600; letter-spacing:-.015em; margin:18px 0 8px; color:var(--principal)}
@media (min-width:700px){ .titulo{font-size:32px; line-height:40px} }
.mezcla{display:flex; flex-direction:column; gap:24px; margin:30px 0 8px}
.materia .fila{display:flex; justify-content:space-between; align-items:baseline}
.materia .nombre{font-weight:600}
.materia .pct{font-family:"Plus Jakarta Sans", Inter, sans-serif; font-weight:700; font-size:22px; color:var(--principal)}
.barra{height:10px; border-radius:6px; background:var(--arena); overflow:hidden; margin:6px 0 6px}
.barra i{display:block; height:100%; width:0; background:var(--principal); border-radius:6px; transition:width 1s cubic-bezier(.2,.7,.2,1)}
/* El ámbar no es relleno de barra: marca con un punto "sol" dónde empezar */
.materia.primera .nombre::before{content:""; display:inline-block; width:12px; height:12px; border-radius:50%;
  background:var(--sol); border:2px solid var(--principal); margin-right:8px; vertical-align:-1px}
.materia p{margin:0; color:var(--texto2); font-size:14.5px}
.porque{margin:0 0 6px}
.creencias{margin-top:28px}
/* H2: Plus Jakarta Sans 600, 24/32 */
.creencias h2{font-size:24px; line-height:32px; font-weight:600; letter-spacing:-.01em; margin:0 0 6px; color:var(--principal)}
.creencias .tarjeta{margin-top:16px; border-left:4px solid var(--principal)}
.creencias .tarjeta h3{margin-bottom:10px; color:var(--principal)}
.creencias .tarjeta p + p{margin-top:10px}
.creencias .tarjeta b{display:block; color:var(--texto); font-weight:600; font-size:14px}
.invitacion{margin:28px 0 0; color:var(--texto2)}
.nota{font-size:14px; color:var(--texto2); margin-top:14px}

/* Cuenta */
.btn.google{background:var(--tarjeta); color:var(--texto); border-color:var(--borde)}
.aviso-demo{font-size:14px; color:var(--texto2); text-align:center; min-height:1.4em}

/* Lección */
.cabecera{display:flex; justify-content:space-between; align-items:center}
.criterio-total{font-size:14px; font-weight:600; color:var(--principal)}
.momento{font-size:14px; color:var(--texto2); font-weight:500; margin-top:6px}
/* Criterio: un sello tranquilo dentro del flujo, no una notificación */
.sello{display:flex; align-items:center; gap:12px; margin-top:22px; padding:12px 16px;
  border:1px solid var(--arena); border-radius:12px; width:fit-content; max-width:100%;
  background:var(--tarjeta); animation:sello .5s cubic-bezier(.2,.7,.2,1) both}
.sello .sol-mini{flex:0 0 18px; height:18px; border-radius:50%; background:var(--sol); border:2px solid var(--principal)}
.sello b{font-family:"Plus Jakarta Sans", Inter, sans-serif; font-weight:700; color:var(--principal); font-size:15px; white-space:nowrap}
.sello span{color:var(--texto2); font-size:14px}
@keyframes sello{from{opacity:0; transform:translateY(6px)}}
.criterio-total{display:flex; align-items:center; gap:8px}
.criterio-total::before{content:""; width:12px; height:12px; border-radius:50%; background:var(--sol); border:2px solid var(--principal)}
.criterio-total.sube{animation:sube .6s ease}
@keyframes sube{40%{transform:scale(1.12)}}
/* Concepto: lo que la persona se lleva de cada pantalla de teoría */
.concepto{margin-top:22px; padding:18px 18px 16px; border-radius:12px; background:var(--principal); color:var(--sobre-principal)}
.concepto small{display:block; font-size:14px; opacity:.9; margin-bottom:4px}
.concepto h3{font-family:"Plus Jakarta Sans", Inter, sans-serif; font-weight:500; font-size:20px; line-height:28px; margin:0 0 6px}
.concepto p{margin:0; font-size:15px}
.subtitulo{font-family:"Plus Jakarta Sans", Inter, sans-serif; font-weight:600; font-size:24px; line-height:32px; letter-spacing:-.01em; margin:30px 0 0; color:var(--principal)}
.tarjeta{background:var(--tarjeta); border:1px solid var(--arena); border-radius:12px; padding:16px 18px; margin-top:20px}
/* Title: Plus Jakarta Sans 600, 18/26 */
.tarjeta h3{font-family:"Plus Jakarta Sans", Inter, sans-serif; font-weight:600; font-size:18px; line-height:26px; margin:0 0 4px}
.tarjeta p{margin:0; color:var(--texto2); font-size:15px}
.vermas{background:none; border:0; color:var(--principal); font-weight:600; padding:10px 0; min-height:44px; text-align:left; text-decoration:underline}
.monedas{display:grid; grid-template-columns:repeat(10,1fr); gap:5px; margin:14px 0 6px; max-width:300px}
.monedas i{aspect-ratio:1; border-radius:50%; background:var(--principal); transition:background .3s, transform .3s}
.monedas i.encajada{background:var(--arena); transform:scale(.8)}
.leyenda{font-size:14px; color:var(--texto2)}
/* Control deslizante: etiqueta + valor, flechas/Inicio/Fin del teclado y botones − / + */
.slider{margin:24px 0 6px}
.slider label{display:flex; justify-content:space-between; font-size:15px; font-weight:500}
.slider .control{display:flex; align-items:center; gap:8px; margin-top:6px}
.slider input{flex:1; min-width:0; min-height:44px; accent-color:var(--principal); margin:0}
.slider .ajuste{flex:0 0 44px; width:44px; height:44px; border-radius:12px; border:2px solid var(--borde);
  background:var(--tarjeta); color:var(--principal); font-size:22px; font-weight:600; line-height:1; padding:0}
.slider .ajuste:hover{border-color:var(--principal); background:var(--seleccion)}
.cifra{font-family:"Plus Jakarta Sans", Inter, sans-serif; font-weight:700; font-size:28px; color:var(--principal); margin:10px 0 0}
.formula{font-size:14px; color:var(--texto2)}
.barras{display:flex; flex-direction:column; gap:18px; margin-top:22px}
.barras .fila{display:flex; justify-content:space-between; font-size:14.5px}
.barras.con-tuya .barra i{background:var(--texto2)}
.barras.con-tuya .tuya .barra i{background:var(--principal)}
.barras .barra{position:relative; overflow:visible}
.barras .barra i{border-radius:6px}
.barras .barra .marca-uno{position:absolute; top:-3px; bottom:-3px; width:2px; background:var(--texto2)}
.fuente{font-size:12px; line-height:16px; letter-spacing:.01em; color:var(--texto2); margin-top:12px}
textarea{width:100%; min-height:90px; font:inherit; color:var(--texto); background:var(--tarjeta);
  border:2px solid var(--borde); border-radius:12px; padding:12px 14px; margin-top:12px; resize:vertical}
textarea:focus{border-color:var(--principal)}
.pregunta-chica{font-weight:600; margin:18px 0 0}
.lista{margin:10px 0 0; padding-left:20px}
.lista li{margin:6px 0}

/* Cuenta */
.campo{display:flex; flex-direction:column; gap:6px; margin-top:18px; font-size:15px; font-weight:500}
.campo input{font:inherit; font-weight:400; color:var(--texto); background:var(--tarjeta); border:2px solid var(--borde);
  border-radius:12px; padding:12px 16px; min-height:48px}
.campo input:focus{border-color:var(--principal)}
.campo input::placeholder{color:var(--texto2); opacity:1}
/* Error: color de error + icono + texto (nunca solo color) */
.error{color:var(--error); font-size:14px; min-height:1.4em; margin-top:12px}
.error:not(:empty){background:var(--error-fondo); border:1px solid var(--error); border-radius:12px; padding:10px 12px}
.error:not(:empty)::before{content:"!"; display:inline-grid; place-items:center; width:18px; height:18px; margin-right:8px;
  border-radius:50%; background:var(--error); color:var(--error-fondo); font-weight:700; font-size:12px; line-height:1; vertical-align:1px}
.privacidad{font-size:14px; color:var(--texto2); margin-top:16px}
.codigo{font-family:"Plus Jakarta Sans", Inter, sans-serif; font-weight:700; font-size:22px; color:var(--principal); letter-spacing:.06em}
/* Otra respuesta (abierta): sirve para descubrir arquetipos nuevos */
.opcion.otra{border-style:dashed}
.opcion.otra .letra{background:transparent; color:var(--texto2); border:1.5px dashed var(--texto2)}
.abierta{margin-top:14px}
.abierta .btn{margin-top:12px; width:100%}
.cuenta{height:3px; border-radius:3px; background:var(--arena); overflow:hidden; margin-bottom:6px}
.cuenta i{display:block; height:100%; width:0; background:var(--principal); transition:width linear}
@media (prefers-reduced-motion: reduce){
  *{animation:none !important; transition:none !important}
  .escena .sol-grande{transform:translate(-50%,0)}
}
.barra-app{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:8px}
.btn-biblioteca{border:1.5px solid var(--borde);border-radius:999px;background:var(--tarjeta);color:var(--principal);padding:8px 13px;min-height:42px;font-size:13px;font-weight:600}
.concepto-acciones{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.concepto-acciones button{border:1px solid currentColor;border-radius:999px;background:transparent;color:inherit;padding:7px 11px;min-height:38px;font:600 13px Inter,sans-serif}
.biblioteca-lista{display:flex;flex-direction:column;gap:12px;margin-top:20px}
.biblioteca-item{background:var(--tarjeta);border:1px solid var(--arena);border-radius:12px;padding:16px}
.biblioteca-item h2{font-size:18px;line-height:1.3;margin:0 0 8px;color:var(--principal)}
.biblioteca-item p{margin:0;color:var(--texto2)}
.biblioteca-item .meta{font-size:12px;margin-top:10px}
.biblioteca-vacia{padding:20px;border:1px dashed var(--borde);border-radius:12px;color:var(--texto2);margin-top:18px}
</style>
</head>
<body>
<main class="app" id="app" aria-live="polite"></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>

<script>
/* ---------- Contenido: diagnóstico v4 borrador (21 oct 2026), sobre la v3 del banco de escenarios ---------- */
// Cambios v4: situaciones hipotéticas ("Imagina que..."), sin urgencia ni nombres de plataformas,
// opción de ahorrar en dólares donde aplica, variantes según la moneda en que cobra la persona,
// y un escenario nuevo sobre cómo se vive la devaluación (C4).
// Puntos de necesidad: [Economía, Finanzas, Conducta]. Los máximos se calculan solos según las variantes que vio cada persona.
const PERFIL_PREGUNTAS = [
  { clave:"edad", pregunta:"¿Cuántos años tienes?", opciones:["18 a 24","25 a 34","35 a 44","45 o más"] },
  { clave:"moneda", pregunta:"¿En qué moneda recibes la mayor parte de tus ingresos?",
    opciones:["Bolívares","Dólares en efectivo","Dólares en una cuenta o billetera digital","USDT u otra cripto","Una mezcla"] },
  { clave:"emergencia", pregunta:"¿Cuentas con un fondo de emergencia equivalente a tres meses de gastos?",
    opciones:["Sí, completo","Parcialmente","No cuento con uno"] }
];
const MONEDA_TEXTO = { "Bolívares":"bolívares", "Dólares en efectivo":"dólares en efectivo",
  "Dólares en una cuenta o billetera digital":"dólares en una cuenta o billetera digital",
  "USDT u otra cripto":"USDT", "Una mezcla":"bolívares y dólares" };
const grupoMoneda = m => (m === "Bolívares" || m === "Una mezcla") ? "bs" : "usd";

/* Diagnóstico v5 (18 nov 2026): 11 situaciones con vocabulario técnico, a partir de las correcciones del profesor.
   BAREMO de puntajes [Economía, Finanzas, Conducta], de 0 a 3. Mide la brecha que revela la decisión, no si "acertó":
     0 = decisión coherente con el criterio de esa materia (sin brecha)
     1 = brecha leve (acierta en lo principal, omite un costo o un dato)
     2 = brecha moderada (decide sin evaluar riesgo, liquidez, costo o poder adquisitivo)
     3 = brecha marcada; en Conducta, indica que la creencia heredada de la crisis está activa
   Una creencia se marca como activa cuando el puntaje de Conducta es 3. */
const ESCENARIOS = [
  { id:"E1", bloque:"Economía", dogma:"El efectivo en dólares es el refugio",
    contexto:"Vendes un bien usado cuyo valor es de US$100. El comprador te ofrece pagarte hoy en bolívares, a la tasa oficial del BCV. La tasa del mercado paralelo se ubica por encima de la oficial. Necesitas el dinero hoy para cubrir gastos corrientes.",
    pregunta:"¿Qué harías?",
    opciones:[
      ["Acepto los bolívares y los destino a mis gastos","Si luego pagas a la tasa del mercado, asumes el diferencial cambiario.",[2,1,1]],
      ["Propongo que me paguen en bolívares a la tasa del mercado","La negociación puede enfriar la venta.",[0,1,1]],

/* ---------- Utilidades ---------- */
const el = (tag, attrs={}, ...hijos) => {
  const n = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs)) {
    if (k === "class") n.className = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) n.setAttribute(k, v);
  }
  for (const h of hijos) if (h != null) n.append(h);
  return n;
};

// Burbujas que aparecen una a una como mensajes; un toque las muestra todas.
function escribir(contenedor, textos, alTerminar){
  let saltado = false, timers = [];
  const burbujas = textos.map(t => {
    const b = el("div", {class:"burbuja" + (t.clase ? " " + t.clase : "")});
    b.dataset.texto = t.texto; return b;
  });
  const boton = el("button", {class:"saltar", type:"button"}, "Toca para ver todo");
  const completar = () => {
    if (saltado) return; saltado = true; timers.forEach(clearTimeout);
    burbujas.forEach(b => { if (!b.isConnected) contenedor.append(b); b.textContent = b.dataset.texto; b.classList.remove("cursor"); });
    boton.remove(); alTerminar && alTerminar();
  };
  boton.addEventListener("click", completar);
  contenedor.addEventListener("click", completar, {once:true});
  if (reducido) { contenedor.append(...burbujas); completar(); return; }
  contenedor.after(boton);
  let k = 0;
  const siguiente = () => {
    if (saltado) return;
    if (k >= burbujas.length) { saltado = true; boton.remove(); alTerminar && alTerminar(); return; }
    // Cada burbuja aparece completa (como un mensaje); la pausa depende de lo largo del texto
    // para que alcance a leerse, sin la sensación de apuro de ver el texto escribiéndose.
    const b = burbujas[k++], txt = b.dataset.texto;
    b.textContent = txt; b.classList.add("entra"); contenedor.append(b);
    const pausa = Math.min(1700, 400 + txt.length * 13);
    timers.push(setTimeout(siguiente, pausa));
  };
  siguiente();
}

function horizonte(paso, total){
  const f = paso / total;
  const sol = el("div", {class:"sol"});
  const avance = el("div", {class:"avance"});
  const h = el("div", {class:"horizonte", role:"progressbar", "aria-valuemin":"0", "aria-valuemax":String(total), "aria-valuenow":String(paso), "aria-label":"Progreso"},
    el("span", {class:"paso"}, `${paso} de ${total}`), el("div", {class:"linea"}), avance, sol);
  const fijar = (x) => { sol.style.left = `calc(${x*100}% )`; sol.style.bottom = `${0 + x*14}px`; avance.style.width = `${x*100}%`; };
  fijar(Math.max(0,(paso-1)/total));
  requestAnimationFrame(() => requestAnimationFrame(() => fijar(f)));
  return h;
}

    area.addEventListener("input", () => guardar.disabled = area.value.trim().length < 5);

        if (k === s.opciones.length) return otraRespuesta();

      pintarOpciones(zona, s.paso1, r1 => {
        setTimeout(() => {

              let p, msg;

// Normaliza por el máximo que pudo sumar cada materia, aplica piso de 20% y redondea a 100.
function calcularMezcla(puntos){
  const n = puntos.map((v,k) => estado.maximos[k] ? v / estado.maximos[k] : 0);
  const suma = n.reduce((a,b) => a+b, 0);
  if (suma === 0) return [33,33,34];
  let p = n.map(v => v / suma);
  const fijas = new Set();
  for (let vuelta = 0; vuelta < 3; vuelta++) {
    const bajas = p.map((v,k) => (!fijas.has(k) && v < 0.2) ? k : -1).filter(k => k >= 0);
    if (!bajas.length) break;
    bajas.forEach(k => fijas.add(k));
    const libres = [0,1,2].filter(k => !fijas.has(k));
    const resto = 1 - 0.2 * fijas.size;
    const sumaLibres = libres.reduce((a,k) => a + n[k], 0);
    p = p.map((v,k) => fijas.has(k) ? 0.2 : (sumaLibres > 0 ? resto * n[k] / sumaLibres : resto / libres.length));
  }
  const crudo = p.map(v => v * 100), base = crudo.map(Math.floor);
  let falta = 100 - base.reduce((a,b) => a+b, 0);
  crudo.map((v,k) => [v - base[k], k]).sort((a,b) => b[0]-a[0]).forEach(([,k]) => { if (falta > 0) { base[k]++; falta--; } });
  return base;
}

  // Botones − / + como alternativa al arrastre (kit Horizonte); usan el mismo paso del control.
  const ajustar = (dir) => () => { dir < 0 ? input.stepDown() : input.stepUp(); input.dispatchEvent(new Event("input", {bubbles:true})); };
  const menos = el("button", {class:"ajuste", type:"button", "aria-label":`Reducir ${etiqueta.toLowerCase()}`}, "−");
  const mas = el("button", {class:"ajuste", type:"button", "aria-label":`Aumentar ${etiqueta.toLowerCase()}`}, "+");
  menos.addEventListener("click", ajustar(-1)); mas.addEventListener("click", ajustar(1));

function barrasPoder(valores, tuya){
  const cont = el("div", {class:"barras" + (tuya >= 0 ? " con-tuya" : "")});
  const filas = valores.map(([nombre, v], k) => {
    const i = el("i"); const marca = el("span", {class:"marca-uno"});
    const etiqueta = el("span", {}, "");
    const f = el("div", {class: k === tuya ? "tuya" : ""},
      el("div", {class:"fila"}, el("span", {}, nombre + (k === tuya ? " (tu opción)" : "")), etiqueta),
      el("div", {class:"barra"}, i, marca));
    return {f, i, marca, etiqueta};
  });
  const pintar = (vals) => vals.forEach(([, v], k) => {
    const {i, marca, etiqueta} = filas[k];
    const ancho = Math.min(v / 1.3, 1) * 100;
    i.style.width = `${ancho}%`; marca.style.left = `${100/1.3}%`;
    etiqueta.textContent = v === 1 ? "igual que hoy" : (v < 1 ? `${pct(1-v)} menos` : `${pct(v-1)} más`);
  });
  cont.append(...filas.map(x => x.f));
  requestAnimationFrame(() => requestAnimationFrame(() => pintar(valores)));
  cont.actualizar = pintar;
  return cont;
}

    el("h1", {class:"titulo"}, `Ganaste ${L.criterio} de 15 de Criterio`),
    el("p", {class:"sublema"}, "Aquí no se premia acertar: se premia razonar."),
    L.conceptos.length ? el("p", {}, el("b", {}, "Hoy aprendiste: "), L.conceptos.map(c => c[0]).join(", ")) : null,
    t ? el("h2", {class:"subtitulo"}, "Tu decisión de esta semana") : null,
    t ? el("div", {class:"tarjeta"}, el("p", {}, `“${t}”`)) : null,
    usuario || L.rechazoCuenta ? null : el("div", {class:"tarjeta"},
      el("p", {}, el("b", {}, "Guarda tu Criterio")),
      el("p", {}, `Crea tu cuenta para que tus ${L.criterio} de Criterio y tu ruta te esperen la próxima vez.`),
      el("div", {style:"margin-top:12px"}, el("button", {class:"btn", type:"button", onclick:cuenta}, "Guardar mi Criterio"))),
    usuario ? el("h2", {class:"subtitulo"}, "Invita a alguien") : null,
    usuario ? (() => {
      const enlace = `${location.origin}${location.pathname}?ref=${usuario.id.slice(0,8)}`;
      const copiar = el("button", {class:"btn secundario", type:"button"}, "Copiar mi enlace");
      copiar.addEventListener("click", async () => { try { await navigator.clipboard.writeText(enlace); copiar.textContent = "Enlace copiado"; } catch { copiar.textContent = enlace; } });
      return el("div", {class:"tarjeta"}, el("p", {}, "Tu código"), el("div", {class:"codigo"}, usuario.id.slice(0,8).toUpperCase()), el("div", {style:"margin-top:12px"}, copiar));
    })() : null,
    avisoInstalar(),
    el("p", {class:"pregunta-chica"}, "¿Quieres la lección 2 cuando esté lista?"),
    el("div", {class:"acciones"},
      el("button", {class:"btn", type:"button", onclick:() => pedir(true)}, "Sí, avísame"),
      el("button", {class:"btn secundario", type:"button", onclick:() => pedir(false)}, "Ahora no"),
      resp,
      el("button", {class:"btn texto", type:"button", onclick:bienvenida}, "Volver al inicio"))
  );
}

/* ---------- Instalar como app (PWA) ---------- */
let pedidoInstalar = null;
addEventListener("beforeinstallprompt", e => { e.preventDefault(); pedidoInstalar = e; });
addEventListener("appinstalled", () => { pedidoInstalar = null; });

// Solo se muestra si no está instalada: en iPhone con instrucciones; en Android si el navegador ofrece instalar.
function avisoInstalar(){
  if (matchMedia("(display-mode: standalone)").matches || navigator.standalone === true) return null;
  const titulo = el("p", {}, el("b", {}, "Instala PRIOR en tu teléfono"));
  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  if (ios) return el("div", {class:"tarjeta"}, titulo, el("p", {class:"nota"}, "Ábrela en Safari, toca Compartir y luego Añadir a pantalla de inicio"));
  if (!pedidoInstalar) return null;
  const caja = el("div", {class:"tarjeta"}, titulo);
  const boton = el("button", {class:"btn secundario", type:"button", style:"margin-top:12px"}, "Instalar");
  boton.addEventListener("click", async () => {
    const p = pedidoInstalar; if (!p) return;
    pedidoInstalar = null;
    p.prompt();
    try { await p.userChoice; } catch {}
    caja.remove();
  });
  caja.append(boton);
  return caja;
}

if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("/sw.js").catch(() => {}));

function final(){
  registrarPaso("leccion_intro");
  const guia = el("div", {class:"guia"});
  const empezar = el("button", {class:"btn", type:"button", disabled:true, onclick:() => {
    L.paso = 0; L.criterio = 0; L.desglose = []; L.datos = {}; L.otorgado = new Set(); L.conceptos = []; L.inicio = Date.now(); PANTALLAS[0](); }}, "Empezar la lección");
  pantalla(
    el("div", {class:"marca"}, "PRIOR"),
    el("h1", {class:"titulo"}, "Tu primera lección: Tasas, bancos y tu bolívar"),
    el("p", {class:"sublema"}, "Economía · lección 1 · unos 8 minutos"),
    guia,
    el("div", {class:"acciones"}, empezar)
  );
  escribir(guia, [
    {texto:"Primero decides con tu dinero, después descubres qué creencia te llevó a esa decisión, y al final lo llevas a tu vida."},
    {texto:"Cada vez que piensas, ganas Criterio. Equivocarte no te quita nada: es parte de aprender."}
  ], () => empezar.disabled = false);
}

bienvenida();
</script>
